[package]
name = "dhcp-relay"
version = "0.1.0"
edition = "2024"
authors = ["Kunihiro Ishiguro <kunihiro@zebra.rs>"]
license = "AGPL-3.0-or-later"
description = "insomnia-dhcp-relay: DHCPv4 / DHCPv6 relay agent driven by insomnia"
publish = false

[[bin]]
name = "insomnia-dhcp-relay"
path = "src/main.rs"

[dependencies]
dhcp-packet = { path = "../dhcp-packet" }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
# Sockets: SO_BINDTODEVICE, IP_PKTINFO / IPV6_PKTINFO ancillary data,
# AF_PACKET sends, getifaddrs(3).
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "net", "signal", "time", "macros", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
