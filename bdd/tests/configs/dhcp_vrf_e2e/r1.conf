set vrf red
set vrf blue
set interface lanred vrf red
set interface wanred vrf red
set interface lanblue vrf blue
set interface wanblue vrf blue
set interface lanred ipv4 address 10.1.0.1/24
set interface lanred ipv6 address 2001:db8:1::1/64
set interface wanred ipv4 address 192.0.2.1/24
set interface wanred ipv6 address 2001:db8::1/64
set interface lanblue ipv4 address 10.1.0.1/24
set interface lanblue ipv6 address 2001:db8:1::1/64
set interface wanblue ipv4 address 192.0.2.1/24
set interface wanblue ipv6 address 2001:db8::1/64
set service dhcp-relay vrf red listen-interface lanred
set service dhcp-relay vrf red upstream-interface wanred
set service dhcp-relay vrf red server 192.0.2.2
set service dhcp-relay vrf blue listen-interface lanblue
set service dhcp-relay vrf blue upstream-interface wanblue
set service dhcp-relay vrf blue server 192.0.2.2
set service dhcpv6-relay vrf red listen-interface lanred
set service dhcpv6-relay vrf red upstream-interface wanred address ff02::1:2
set service dhcpv6-relay vrf blue listen-interface lanblue
set service dhcpv6-relay vrf blue upstream-interface wanblue address ff02::1:2
