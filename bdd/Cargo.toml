[package]
name = "bdd"
version = "0.1.0"
edition = "2024"
authors = ["Kunihiro Ishiguro <kunihiro@zebra.rs>"]
license = "AGPL-3.0-or-later"
description = "Cucumber BDD harness driving zebra-rs + insomnia inside Linux network namespaces"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1.0"

[dev-dependencies]
rstest = "0.26"
tempfile = "3"
cucumber = { version = "0.23", features = ["output-json"] }
futures = "0.3"

[[test]]
name = "cucumber"
harness = false

[lints]
workspace = true
