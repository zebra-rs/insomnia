# Shipped by the insomnia package. zebra-rs has the configuration trees
# insomnia enforces only when it runs with --feature insomnia, so this
# replaces the zebra-rs package's ExecStart (/usr/bin/zebra-rs, no
# arguments; keep the two in step). It takes effect the next time
# zebra-rs starts. To start zebra-rs differently, put a drop-in of the
# same name in /etc/systemd/system/zebra-rs.service.d/, which replaces
# this one.
[Service]
ExecStart=
ExecStart=/usr/bin/zebra-rs --feature insomnia
