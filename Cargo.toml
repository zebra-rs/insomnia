[package]
name = "insomnia"
# Kept in sync with the top-level `version` file by packaging/version-update.sh;
# cargo-deb reads the package version from here.
version = "0.2.0"
edition = "2024"
authors = ["Kunihiro Ishiguro <kunihiro@zebra.rs>"]
description = "Out-of-process firewall / IPsec / VRRP enforcement daemon for zebra-rs"
license = "AGPL-3.0-or-later"
homepage = "https://zebra.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
# preserve_order matches zebra-rs, so JSON show output keeps the same
# key order the in-process backends produced.
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tower = { version = "0.5", default-features = false, features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# kill(2) for keepalived reload / JSON-dump signals and pid liveness.
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14"

# The BDD harness (bdd/) is a workspace member so one `cargo` invocation
# covers both; its cucumber test needs root + network namespaces and is run
# through bdd/Makefile, never by CI (`cargo test --workspace --exclude bdd`).
[workspace]
members = ["bdd"]

# Workspace-wide clippy configuration, inherited via `[lints] workspace =
# true` (the same set zebra-rs uses, so the shared harness sources lint
# identically in both repositories).
[workspace.lints.clippy]
upper_case_acronyms = "allow"
let_underscore_future = "allow"
result_large_err = "allow"
large_enum_variant = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
len_without_is_empty = "allow"

# Debian packaging (cargo-deb). `cargo deb` reads this table; the version
# comes straight from `version` above (kept in sync with the top-level
# `version` file by packaging/version-update.sh). The packaging Makefile
# (packaging/Makefile) drives the build.
[package.metadata.deb]
maintainer = "Kunihiro Ishiguro <kunihiro@zebra.rs>"
section = "net"
priority = "optional"
# Automatic shared-library Depends via dpkg-shlibdeps over the built binary,
# plus nftables: the firewall backend renders rulesets and applies them
# atomically with `nft -f -`.
depends = "$auto, nftables"
# The IPsec backend renders /etc/swanctl/swanctl.conf and drives strongSwan
# through `swanctl -q` and charon's VICI socket; the VRRP backend renders
# keepalived.conf and drives keepalived through the insomnia-keepalived@
# template unit. Recommends rather than Depends: each backend works fine
# without the others' daemons installed.
recommends = "strongswan-swanctl, charon-systemd, keepalived"
# The whole point of this daemon is enforcing zebra-rs's firewall/vpn config,
# but it can run on a different host than zebra-rs (tcp://HOST:PORT), so the
# zebra-rs package itself is only suggested.
suggests = "zebra-rs"
# Drop the default `-1` revision so the artifact stays insomnia_<ver>_<arch>.deb
# (the CI dist-suffix rename in build-debs.yaml expects that shape).
revision = ""
# Debian-format changelog generated from the single-source CHANGELOG.yaml by
# packaging/changelog-gen.sh (the packaging Makefile runs it before cargo deb).
changelog = "packaging/out/changelog"
extended-description = """
insomnia is the out-of-process firewall / IPsec / VRRP enforcement daemon
for zebra-rs. zebra-rs owns the configuration (YANG schema, candidate/running
stores, commit); insomnia subscribes to the `firewall`, `vpn ipsec` and
`vrrp` running-config subtrees over gRPC and renders them into nftables,
strongSwan (swanctl) and keepalived state, and answers `show firewall` /
`show vpn ipsec` / `show vrrp` on the zebra-rs CLI as the show provider for
the three trees."""
# Custom maintainer scripts; each carries a #DEBHELPER# token where cargo-deb
# injects the generated systemd fragments.
maintainer-scripts = "packaging/maintainer"
assets = [
  ["target/release/insomnia", "usr/bin/", "755"],
]

# systemd units. cargo-deb adds every unit under packaging/systemd as an
# asset and injects the enable/start/restart/stop fragments at the
# #DEBHELPER# token in the maintainer scripts:
#  * insomnia.service — enabled and started, restart-after-upgrade. It runs
#    a bare `insomnia`; the default --host (unix:zebra-rs/vty), --swanctl-dir
#    (/etc/swanctl), --vici-socket (/var/run/charon.vici) and
#    --keepalived-dir (/run/insomnia/vrrp) resolve a same-host install
#    without flags.
#  * insomnia-keepalived@.service — the per-VRF keepalived template unit
#    insomnia starts, reloads and stops itself; neither enabled nor started
#    at install time.
systemd-units = [
  { unit-name = "insomnia", unit-scripts = "packaging/systemd", restart-after-upgrade = true },
  { unit-name = "insomnia-keepalived@", unit-scripts = "packaging/systemd", enable = false, start = false },
]
